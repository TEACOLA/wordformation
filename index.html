<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wordformation</title>
  <meta name="description" content="言葉を登録して、ランダムに組み合わさる2つの言葉から新しい造語を生み出すサービス。">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0077873067570601"
     crossorigin="anonymous"></script>
  
  <link rel="stylesheet" href="style.css?v=20260925i">
</head>
<body>
  <div class="app-container">

    <!-- (1) 造語インスピレーションステージ（最上部） -->
    <section class="stage-section" aria-label="造語ステージ">
      <div class="stage-card" id="stage-card">
        <div class="word-slots">
          <div class="word-box slot-a" id="slot-a-wrapper">
            <button type="button" class="pin-btn" id="pin-btn-a" title="言葉aを固定 (Pin)" aria-label="言葉aを固定" aria-pressed="false">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="17" x2="12" y2="22"></line>
                <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h.5a1.5 1.5 0 0 0 0-3h-7a1.5 1.5 0 0 0 0 3H9v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
              </svg>
            </button>
            <div class="slot-content" id="word-a" title="クリックして言葉aを固定 (Pin OFF)">word</div>
          </div>
          
          <button type="button" class="connector" id="connector-icon" title="言葉aと言葉bを入れ替える" aria-label="言葉aと言葉bを入れ替える">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>

          <div class="word-box slot-b" id="slot-b-wrapper">
            <button type="button" class="pin-btn" id="pin-btn-b" title="言葉bを固定 (Pin)" aria-label="言葉bを固定" aria-pressed="false">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="17" x2="12" y2="22"></line>
                <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h.5a1.5 1.5 0 0 0 0-3h-7a1.5 1.5 0 0 0 0 3H9v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
              </svg>
            </button>
            <div class="slot-content" id="word-b" title="クリックして言葉bを固定 (Pin OFF)">formation</div>
          </div>
        </div>

        <!-- 結合プレビュー ＆ クイックコピー -->
        <div class="combined-bar">
          <div class="combined-preview" id="combined-preview" title="copy">
            <span class="combined-text" id="combined-text">wordformation</span>
            <span class="copy-hint" id="copy-hint">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>copy</span>
            </span>
          </div>
        </div>
      </div>
    </section>

    <!-- (2) 言葉を入力するフォーム -->
    <section class="input-section" aria-label="言葉の登録">
      <form id="word-form" class="word-form" autocomplete="off">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="word-input" 
            class="word-input" 
            placeholder="maximum 600 words"
            autofocus 
            aria-label="登録したい言葉"
          />
          <button type="submit" class="submit-btn" id="submit-btn" title="Add" aria-label="Add">
            <span class="enter-badge">Add</span>
          </button>
        </div>
      </form>
    </section>
  </div>

  <!-- (3) 登録した言葉のタグクラウド（画面最下部まで全幅で直結） -->
  <section class="cloud-section" aria-label="登録された言葉一覧">
    <div class="cloud-inner">
      <div class="tag-cloud" id="tag-cloud">
        <!-- JSでタグ要素が挿入されます -->
      </div>
      <div class="cloud-footer">
        <button type="button" class="btn-clear" id="btn-reset" title="clear" aria-label="登録した言葉を初期化">
          clear
        </button>
      </div>
    </div>
  </section>

  <!-- Toast notification -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=20260925a"></script>
</body>
</html>
